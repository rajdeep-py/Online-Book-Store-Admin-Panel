<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Books - Book Heaven Storefront Manager</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/tables.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  
  <!-- Font Awesome Icons & Google Fonts Outfit -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Collapsible Sidebar Container -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <div class="main-content">
      
      <!-- Top Sticky Navbar Header -->
      <header id="navbar-container" class="navbar"></header>

      <main class="content-body">
        
        <!-- Breadcrumbs Navigation -->
        <div class="page-header">
          <div class="page-title-block">
            <h1>Books Inventory Catalog</h1>
            <ul class="breadcrumb">
              <li class="breadcrumb-item"><a href="index.html">Home</a></li>
              <li class="breadcrumb-item active">Books</li>
            </ul>
          </div>
          <!-- Add Book redirect trigger -->
          <div class="page-actions-block">
            <a href="add-book.html" class="btn btn-primary">
              <i class="fas fa-plus"></i> Add New Book
            </a>
          </div>
        </div>

        <!-- Central Catalog Card Data-Table -->
        <div class="card p-4">
          
          <!-- Filters and Search Action bar -->
          <div class="table-filter-bar">
            
            <div class="filter-bar-left">
              <!-- Inline Text Search -->
              <div class="table-search-wrapper" style="max-width:320px;">
                <i class="fas fa-search table-search-icon"></i>
                <input type="text" placeholder="Search by title, author, ISBN..." class="table-search-input" id="book-search">
              </div>
              
              <!-- Category select dropdown loaded by JS -->
              <select class="table-filter-select" id="book-filter-category">
                <option value="all">All Categories</option>
                <!-- Loaded dynamically by JS -->
              </select>
            </div>
            
            <div class="filter-bar-right">
              <span class="text-muted" style="font-size: 0.85rem; font-weight: 500;">
                <i class="fas fa-exclamation-circle text-warning"></i> Yellow warnings signify low stock levels
              </span>
            </div>

          </div>

          <!-- Renders Books Table component outline -->
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Book ID</th>
                  <th>Book Details</th>
                  <th>Category</th>
                  <th>Unit Price</th>
                  <th>Stock Qty</th>
                  <th>Catalog Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="books-table-body">
                <!-- Loaded dynamically by assets/js/books.js -->
              </tbody>
            </table>
          </div>

          <!-- Books Pagination Controls bar -->
          <div class="table-pagination-bar">
            <span class="pagination-info" id="pagination-info-label">Showing 1 to 8 of 30 books</span>
            <ul class="pagination-controls">
              <li><button class="page-btn" id="pag-prev" disabled><i class="fas fa-chevron-left"></i> Previous</button></li>
              <li><button class="page-btn" id="pag-next">Next <i class="fas fa-chevron-right"></i></button></li>
            </ul>
          </div>

        </div>

      </main>

      <!-- Site Global Footer -->
      <footer id="footer-container" class="main-footer"></footer>

    </div>
  </div>

  <!-- core scripts -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  
  <!-- books controller script -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/books.js"></script>
</body>
</html>
