<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Settings - Book Heaven Storefront Manager</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  
  <!-- Font Awesome Icons & Google Fonts Outfit -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Collapsible Sidebar Container -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <div class="main-content">
      
      <!-- Top Sticky Navbar Header -->
      <header id="navbar-container" class="navbar"></header>

      <main class="content-body">
        
        <!-- Breadcrumbs Navigation -->
        <div class="page-header">
          <div class="page-title-block">
            <h1>Administrative Preferences</h1>
            <ul class="breadcrumb">
              <li class="breadcrumb-item"><a href="index.html">Home</a></li>
              <li class="breadcrumb-item active">Settings</li>
            </ul>
          </div>
          <div class="page-actions-block">
            <span class="text-muted" style="font-weight: 500;">
              Adjustments apply immediately across all layouts
            </span>
          </div>
        </div>

        <!-- Settings Cards Grid -->
        <div class="card p-4" style="max-width: 780px;">
          <form id="settings-form" novalidate>
            
            <h3 style="font-family:'Outfit', sans-serif; font-weight:700; color:var(--dark-color); margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);">
              <i class="fas fa-sliders-h text-primary"></i> Core System Configurations
            </h3>
            
            <div class="form-grid">
              
              <!-- Storefront Title -->
              <div class="form-group">
                <label for="set-site-name" class="form-label">Storefront Name <span class="required-star">*</span></label>
                <input type="text" id="set-site-name" class="form-control" required minlength="3" placeholder="e.g. Book Heaven">
              </div>

              <!-- Admin email -->
              <div class="form-group">
                <label for="set-site-email" class="form-label">Support Email Address <span class="required-star">*</span></label>
                <input type="email" id="set-site-email" class="form-control" required placeholder="e.g. support@bookheaven.com">
              </div>

              <!-- Low stock alert threshold -->
              <div class="form-group">
                <label for="set-low-stock" class="form-label">Low Stock Alert Threshold <span class="required-star">*</span></label>
                <input type="number" id="set-low-stock" class="form-control" required min="1" max="100" placeholder="e.g. 10">
                <small class="text-muted">Triggers stock warnings in inventory list when volume reaches or falls below this number.</small>
              </div>

              <!-- Currency Symbol select -->
              <div class="form-group">
                <label for="set-currency" class="form-label">Active Currency Symbol <span class="required-star">*</span></label>
                <select id="set-currency" class="form-control" required>
                  <option value="₹">INR (₹)</option>
                  <option value="€">EUR (€)</option>
                  <option value="£">GBP (£)</option>
                  <option value="₹">INR (₹)</option>
                </select>
              </div>

              <!-- Theme select -->
              <div class="form-group">
                <label for="set-theme" class="form-label">Active Visual Theme <span class="required-star">*</span></label>
                <select id="set-theme" class="form-control" required>
                  <option value="light">Light Mode</option>
                  <option value="dark">Dark Mode</option>
                </select>
                <small class="text-muted">Swaps layout CSS colors variables globally.</small>
              </div>

            </div>

            <!-- Submit buttons -->
            <div class="mt-4 p-3 d-flex justify-content-end gap-2" style="border-top: 1px solid var(--border-color);">
              <button type="button" class="btn btn-secondary" onclick="window.location.reload();">Reset</button>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-check"></i> Apply Configuration
              </button>
            </div>

          </form>
        </div>

      </main>

      <!-- Site Global Footer -->
      <footer id="footer-container" class="main-footer"></footer>

    </div>
  </div>

  <!-- core scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/validation.js"></script>
  
  <!-- main initializer script -->
  <script src="assets/js/main.js"></script>

  <!-- Settings logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const filename = window.location.pathname.split('/').pop();
      if (filename !== 'settings.html') return;

      const form = document.getElementById('settings-form');
      const setSiteName = document.getElementById('set-site-name');
      const setSiteEmail = document.getElementById('set-site-email');
      const setLowStock = document.getElementById('set-low-stock');
      const setCurrency = document.getElementById('set-currency');
      const setTheme = document.getElementById('set-theme');

      // 1. Populate current values
      const currentSettings = BookstoreAPI.getSettings();
      setSiteName.value = currentSettings.siteTitle;
      setSiteEmail.value = currentSettings.siteEmail;
      setLowStock.value = currentSettings.lowStockThreshold;
      setCurrency.value = currentSettings.currency;
      setTheme.value = currentSettings.theme;

      // 2. Bind form submissions
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        if (window.Validation && !Validation.validateForm(form)) {
          showToast('Please fix validation errors on form fields!', 'danger');
          return;
        }

        const formData = {
          siteTitle: setSiteName.value.trim(),
          siteEmail: setSiteEmail.value.trim(),
          lowStockThreshold: parseInt(setLowStock.value),
          currency: setCurrency.value,
          theme: setTheme.value
        };

        // Update settings in database
        BookstoreAPI.updateSettings(formData);

        // Apply theme immediately
        document.documentElement.setAttribute('data-theme', formData.theme);

        // Log notification
        BookstoreAPI.addNotification('system', 'System Preferences Altered', 'Administrative control preferences were updated.');
        showToast('Administrative configurations updated successfully!', 'success');

        // Refresh layouts after a brief period to update sidebar title
        setTimeout(() => {
          window.location.reload();
        }, 800);
      });
    });
  </script>
</body>
</html>
