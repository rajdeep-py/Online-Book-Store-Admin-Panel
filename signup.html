<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Signup - Book Heaven Storefront Manager</title>

  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/forms.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

  <div class="login-card fade-in-up" style="max-width: 520px;">
    <div class="login-brand">
      <div class="login-logo">
        <i class="fas fa-user-shield"></i>
      </div>
      <h1 class="login-title">Create Admin Account</h1>
      <p class="login-subtitle">Register a new administrator for the control panel</p>
    </div>

    <div id="signup-alert-box" style="display: none; margin-bottom: 1.25rem;" class="badge badge-cancelled w-100 p-3 justify-content-center">
      <i class="fas fa-exclamation-circle"></i>
      <span id="signup-alert-message">Please complete the form.</span>
    </div>

    <form id="admin-signup-form" novalidate>
      <div class="form-group">
        <label for="admin-name" class="form-label">Admin Name <span class="required-star">*</span></label>
        <input type="text" id="admin-name" class="form-control" placeholder="Enter admin name" required>
      </div>

      <div class="form-group">
        <label for="admin-email" class="form-label">Email Address <span class="required-star">*</span></label>
        <input type="email" id="admin-email" class="form-control" placeholder="Enter admin email" required>
      </div>

      <div class="form-group">
        <label for="admin-password" class="form-label">Password <span class="required-star">*</span></label>
        <input type="password" id="admin-password" class="form-control" placeholder="Create a secure password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirm Password <span class="required-star">*</span></label>
        <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 p-3" style="font-size: 1rem;">
        <i class="fas fa-user-plus"></i> Create Admin Account
      </button>
    </form>

    <div class="text-center mt-4">
      <p class="text-muted" style="font-size: 0.86rem; margin-bottom: 0.75rem;">
        Already registered?
      </p>
      <a href="login.html" class="btn btn-secondary w-100 p-3" style="font-size: 0.95rem;">
        <i class="fas fa-sign-in-alt"></i> Back to Login
      </a>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/validation.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('admin-signup-form');
      const nameInput = document.getElementById('admin-name');
      const emailInput = document.getElementById('admin-email');
      const passwordInput = document.getElementById('admin-password');
      const confirmPasswordInput = document.getElementById('confirm-password');
      const alertBox = document.getElementById('signup-alert-box');
      const alertMessage = document.getElementById('signup-alert-message');

      const showError = (message) => {
        alertBox.style.display = 'flex';
        alertMessage.textContent = message;
        showToast(message, 'danger');
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (window.Validation && !Validation.validateForm(form)) {
          return;
        }

        if (passwordInput.value !== confirmPasswordInput.value) {
          showError('Passwords do not match.');
          return;
        }

        if (passwordInput.value.length < 8) {
          showError('Password must be at least 8 characters long.');
          return;
        }

        const result = await Auth.registerAdmin(
          nameInput.value.trim(),
          emailInput.value.trim(),
          passwordInput.value
        );

        if (result.success) {
          showToast(result.message, 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 900);
        } else {
          showError(result.message);
        }
      });

      [nameInput, emailInput, passwordInput, confirmPasswordInput].forEach((input) => {
        input.addEventListener('input', () => {
          alertBox.style.display = 'none';
        });
      });
    });
  </script>
</body>
</html>
