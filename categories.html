<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories - Book Heaven Storefront Manager</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/tables.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  
  <!-- Font Awesome Icons & Google Fonts Outfit -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Collapsible Sidebar Container -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <div class="main-content">
      
      <!-- Top Sticky Navbar Header -->
      <header id="navbar-container" class="navbar"></header>

      <main class="content-body">
        
        <!-- Breadcrumbs Navigation -->
        <div class="page-header">
          <div class="page-title-block">
            <h1>Genre Categories</h1>
            <ul class="breadcrumb">
              <li class="breadcrumb-item"><a href="index.html">Home</a></li>
              <li class="breadcrumb-item active">Categories</li>
            </ul>
          </div>
          <div class="page-actions-block">
            <span class="text-muted" style="font-weight: 500;">
              Categories feed directly into inventory dropdown controls
            </span>
          </div>
        </div>

        <!-- Categories Split Grid -->
        <div class="dashboard-grid-1">
          
          <!-- Left Panel: Create Category Form Card -->
          <div class="card p-4">
            <div class="card-header m-0 mb-4">
              <h3 class="card-title">Create Genre Category</h3>
            </div>
            <form id="create-category-form" novalidate>
              <div class="form-group">
                <label for="new-category-name" class="form-label">Category Name <span class="required-star">*</span></label>
                <input type="text" id="new-category-name" class="form-control" placeholder="e.g. Science Fiction" required minlength="3">
                <div class="error-feedback" id="category-error" style="display: none;">This field is required.</div>
              </div>
              
              <button type="submit" class="btn btn-primary w-100 mt-2 p-3">
                <i class="fas fa-plus"></i> Save Category
              </button>
            </form>
          </div>

          <!-- Right Panel: Active Genres Lists Table -->
          <div class="card p-4">
            <div class="card-header m-0 mb-4">
              <h3 class="card-title">Active Bookstore Genres</h3>
            </div>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Category Title</th>
                    <th>Linked Book Volumes</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="categories-table-body">
                  <!-- Loaded dynamically by local JavaScript -->
                </tbody>
              </table>
            </div>

          </div>

        </div>

      </main>

      <!-- Site Global Footer -->
      <footer id="footer-container" class="main-footer"></footer>

    </div>
  </div>

  <!-- core scripts -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/validation.js"></script>
  
  <!-- main initializer script -->
  <script src="assets/js/main.js"></script>

  <!-- Local Script Controller for Categories -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const filename = window.location.pathname.split('/').pop();
      if (filename !== 'categories.html') return;

      renderCategoriesList();

      const form = document.getElementById('create-category-form');
      const input = document.getElementById('new-category-name');
      const errorLabel = document.getElementById('category-error');

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const val = input.value.trim();

        // Audit check
        if (!val || val.length < 3) {
          input.classList.add('input-error');
          errorLabel.style.display = 'block';
          errorLabel.textContent = 'Category name must be at least 3 characters.';
          return;
        }

        input.classList.remove('input-error');
        errorLabel.style.display = 'none';

        const categories = BookstoreAPI.getCategories();
        if (categories.some(c => c.toLowerCase() === val.toLowerCase())) {
          input.classList.add('input-error');
          errorLabel.style.display = 'block';
          errorLabel.textContent = 'This category genre already exists!';
          showToast('This category genre already exists!', 'warning');
          return;
        }

        // Add
        BookstoreAPI.addCategory(val);
        BookstoreAPI.addNotification('system', 'New Category Created', `Genre Category "${val}" was added to systems.`);
        showToast(`"${val}" successfully created!`, 'success');
        
        input.value = '';
        renderCategoriesList();
      });

      input.addEventListener('input', () => {
        input.classList.remove('input-error');
        errorLabel.style.display = 'none';
      });
    });

    function renderCategoriesList() {
      if (!window.BookstoreAPI) return;
      const categories = BookstoreAPI.getCategories();
      const books = BookstoreAPI.getBooks();
      const tbody = document.getElementById('categories-table-body');

      if (!tbody) return;

      tbody.innerHTML = categories.map(cat => {
        // Count books linked to this genre
        const bookCount = books.filter(b => b.category.toLowerCase() === cat.toLowerCase()).length;
        
        return `
          <tr class="fade-in">
            <td><strong>${cat}</strong></td>
            <td><strong>${bookCount}</strong> books</td>
            <td>
              <div class="table-actions">
                <button class="action-btn btn-delete delete-cat-btn" data-category="${cat}" title="Delete Category">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('.delete-cat-btn').forEach(btn => {
        btn.onclick = () => {
          const catName = btn.dataset.category;
          promptDeleteCategory(catName);
        };
      });
    }

    function promptDeleteCategory(catName) {
      const books = BookstoreAPI.getBooks();
      const bookCount = books.filter(b => b.category.toLowerCase() === catName.toLowerCase()).length;

      if (bookCount > 0) {
        createModal({
          title: 'Cannot Delete Genre',
          contentHTML: `<p>Genre Category <strong>"${catName}"</strong> currently has <strong>${bookCount}</strong> books linked to it.</p><p>Please reassign or delete those books from catalog inventory before removing this genre.</p>`,
          actions: [{ id: 'close', label: 'Close', type: 'secondary' }]
        });
        return;
      }

      createModal({
        title: 'Delete Genre Category',
        contentHTML: `<p>Are you sure you want to delete category <strong>"${catName}"</strong> from systems?</p>`,
        actions: [
          { id: 'cancel', label: 'Cancel', type: 'secondary' },
          {
            id: 'confirm',
            label: 'Delete',
            type: 'danger',
            callback: (close) => {
              BookstoreAPI.deleteCategory(catName);
              BookstoreAPI.addNotification('system', 'Category Genre Deleted', `Category genre "${catName}" was removed.`);
              showToast(`"${catName}" category deleted.`, 'success');
              close();
              renderCategoriesList();
            }
          }
        ]
      });
    }
  </script>
</body>
</html>
