<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Notifications - Book Heaven Storefront Manager</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  
  <!-- Font Awesome Icons & Google Fonts Outfit -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Tabs filter style */
    .notif-tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 1.5rem;
      gap: 1.5rem;
    }
    
    .notif-filter-tab {
      padding: 0.85rem 0.25rem;
      font-weight: 600;
      color: var(--secondary-color);
      cursor: pointer;
      position: relative;
      transition: all var(--transition-fast);
      font-size: 0.92rem;
    }
    
    .notif-filter-tab:hover {
      color: var(--primary-color);
    }
    
    .notif-filter-tab.active {
      color: var(--primary-color);
    }
    
    .notif-filter-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2.5px;
      background-color: var(--primary-color);
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Collapsible Sidebar Container -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <div class="main-content">
      
      <!-- Top Sticky Navbar Header -->
      <header id="navbar-container" class="navbar"></header>

      <main class="content-body">
        
        <!-- Breadcrumbs Navigation -->
        <div class="page-header">
          <div class="page-title-block">
            <h1>System Activities Inbox <span id="unread-notif-header-count" class="text-primary font-weight-bold" style="font-size: 1.1rem; margin-left:0.35rem;"></span></h1>
            <ul class="breadcrumb">
              <li class="breadcrumb-item"><a href="index.html">Home</a></li>
              <li class="breadcrumb-item active">Notifications</li>
            </ul>
          </div>
          <div class="page-actions-block">
            <button class="btn btn-primary" id="mark-all-read-btn">
              <i class="fas fa-check-double"></i> Mark All as Read
            </button>
          </div>
        </div>

        <!-- Central Inbox Card -->
        <div class="card p-4">
          
          <!-- Filters tabs (All, Unread) -->
          <div class="notif-tabs">
            <div class="notif-filter-tab active" data-filter="all">All Logs</div>
            <div class="notif-filter-tab" data-filter="unread">Unread Only</div>
          </div>

          <!-- Container for Notifications lists -->
          <div id="notifications-list-container">
            <!-- Loaded dynamically by assets/js/notifications.js -->
          </div>

        </div>

      </main>

      <!-- Site Global Footer -->
      <footer id="footer-container" class="main-footer"></footer>

    </div>
  </div>

  <!-- core scripts -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  
  <!-- notifications controller script -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/notifications.js"></script>
</body>
</html>
